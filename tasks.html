<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Tasks — Incossify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="bg"></div>
  <div class="app-body">

    <div class="app-top">
      <a href="dashboard.html" class="back-btn glass">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      </a>
      <div>
        <p style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--primary);font-weight:700;">Daily earn</p>
        <h1>Tasks</h1>
      </div>
    </div>

    <!-- Progress card -->
    <div class="progress-card" style="margin-top:1.25rem;">
      <div class="rel">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.12em;opacity:0.8;">Progress</p>
            <p style="margin-top:0.25rem;font-size:1.5rem;font-weight:800;" id="progressText">0/0 completed</p>
            <p style="font-size:0.75rem;opacity:0.9;margin-top:0.25rem;" id="earnedToday">Earned ₦0 today</p>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:2rem;width:2rem;opacity:0.9;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <div class="bar"><div id="progressBar" style="width:0%;"></div></div>
      </div>
    </div>

    <!-- Tasks -->
    <div style="margin-top:1.5rem;display:grid;gap:0.75rem;" id="taskList">
      <p style="text-align:center;font-size:0.875rem;color:var(--foreground);opacity:0.6;padding:2.5rem 0;">Loading tasks…</p>
    </div>

  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="toast" id="toastBar"></div>

<script type="module">
  import { getCurrentUser, saveUsers, getUsers, saveUser, fmt, esc, renderNav, toast } from "./assets/app.js";

  // ── Task catalog ──
  const CATALOG = [
    { id: "innshare",     title: "Inn-Share",              desc: "Share today's Inn post on your status and take a screenshot.", reward: 500,  icon: "share" },
    { id: "innreshare",   title: "Inn-Reshare",            desc: "Reshare a member's post to your followers and submit proof.", reward: 200,  icon: "share" },
    { id: "ghostwriter",  title: "Inn Ghostwriter",        desc: "Write a short creative caption for our brand page.", reward: 1000, icon: "pen" },
    { id: "survey",       title: "Inn Survey",             desc: "Complete today's short market survey on the link provided.", reward: 1000, icon: "clipboard" },
    { id: "videoclip",    title: "Inn Video Clipping",     desc: "Clip a 15-second highlight from the provided video.", reward: 1500, icon: "video" },
    { id: "moviereview",  title: "Inn Movie Review",       desc: "Review today's featured movie in 3 sentences.", reward: 500,  icon: "star" },
    { id: "aiassistant",  title: "Inn AI Assistant",       desc: "Ask our AI assistant a question and submit the reply.", reward: 750,  icon: "sparkles" },
  ];
  const ICONS = {
    share: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line></svg>',
    pen: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>',
    clipboard: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>',
    video: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>',
    star: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>',
    sparkles: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg>',
  };
  const BADGES = {
    available: { label: "Available", cls: "badge-available" },
    claimed:   { label: "In progress", cls: "badge-claimed" },
    completed: { label: "Completed", cls: "badge-completed" },
  };

  function todayKey() { return new Date().toISOString().slice(0, 10); }

  const user = getCurrentUser();
  if (!user) { window.location.href = "login.html"; throw new Error("redirect"); }

  let tasks = {}; // { [date]: { [taskId]: "available"|"claimed"|"completed" } }
  try { tasks = JSON.parse(localStorage.getItem("incossify_tasks") || "{}"); } catch (_) {}

  function taskStatus(taskId) {
    const day = tasks[todayKey()] || {};
    return day[taskId] || "available";
  }

  function persistTaskState() {
    localStorage.setItem("incossify_tasks", JSON.stringify(tasks));
    // keep the current user in sync in the users array too
    const users = getUsers();
    const idx = users.findIndex(u => u.email === user.email);
    if (idx >= 0) { users[idx] = user; saveUsers(users); }
  }

  function load() {
    render();
    renderNav("tasks");
  }

  function render() {
    const day = tasks[todayKey()] || {};
    const completed = CATALOG.filter(t => day[t.id] === "completed").length;
    const earned = CATALOG.filter(t => day[t.id] === "completed").reduce((s, t) => s + t.reward, 0);
    const pct = Math.round(completed / CATALOG.length * 100);

    document.getElementById("progressText").textContent = completed + "/" + CATALOG.length + " completed";
    document.getElementById("earnedToday").textContent = "Earned ₦" + earned.toLocaleString() + " today";
    document.getElementById("progressBar").style.width = pct + "%";

    const list = document.getElementById("taskList");
    if (CATALOG.length === 0) {
      list.innerHTML = '<p style="text-align:center;font-size:0.875rem;color:var(--foreground);opacity:0.6;padding:2.5rem 0;">No tasks available right now.</p>';
      return;
    }
    list.innerHTML = CATALOG.map(t => {
      const st = taskStatus(t.id);
      const b = BADGES[st];
      const action = st === "available" ? "Claim" : st === "claimed" ? "Complete" : "";
      return `
      <div class="task-item glass-strong">
        <div class="row">
          <div class="ic">${ICONS[t.icon]}</div>
          <div style="flex:1;min-width:0;">
            <div class="title"><b>${esc(t.title)}</b><span class="reward">+₦${t.reward.toLocaleString()}</span></div>
            <p class="desc">${esc(t.desc)}</p>
            <div class="foot">
              <span class="badge ${b.cls}">${b.label}</span>
              ${action ? `<button class="btn btn-aqua btn-sm" data-id="${t.id}" ${st === "claimed" ? "data-complete" : ""}>${action}</button>` : `<span style="display:inline-flex;align-items:center;gap:0.25rem;color:var(--primary);font-size:0.75rem;font-weight:700;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:0.875rem;width:0.875rem;"><path d="M20 6 9 17l-5-5"></path></svg> Done</span>`}
            </div>
          </div>
        </div>
      </div>`;
    }).join("");

    list.querySelectorAll("[data-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const st = taskStatus(id);
        btn.disabled = true;
        btn.textContent = "…";
        const day = tasks[todayKey()] || {};
        if (st === "available") {
          day[id] = "claimed";
        } else if (st === "claimed") {
          day[id] = "completed";
          const task = CATALOG.find(t => t.id === id);
          if (task) {
            user.taskBalance = Number(user.taskBalance || 0) + task.reward;
            user.totalBalance = Number(user.totalBalance || 0) + task.reward;
            saveUser(user);
          }
        }
        tasks[todayKey()] = day;
        persistTaskState();
        toast("+₦" + (CATALOG.find(t => t.id === id) || {}).reward.toLocaleString() + " earned!");
        render();
      });
    });
  }

  load();
</script>
</body>
</html>
