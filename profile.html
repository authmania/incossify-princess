<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Profile — Incossify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="bg"></div>
  <div class="app-body">

    <div class="app-top">
      <a href="dashboard.html" class="back-btn glass">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      </a>
      <h1 style="font-size:1.5rem;font-weight:800;">Profile</h1>
    </div>

    <div class="card glass-strong shadow-elegant" style="margin-top:1.5rem;padding:1.5rem;text-align:center;">
      <div style="margin:0 auto;height:5rem;width:5rem;border-radius:999px;background:var(--gradient-aqua);padding:3px;box-shadow:var(--shadow-aqua);">
        <div style="height:100%;width:100%;border-radius:999px;background:var(--background);display:grid;place-items:center;font-size:1.5rem;font-weight:800;color:var(--primary);" id="avatarLetter">?</div>
      </div>
      <p style="margin-top:1rem;font-size:1.125rem;font-weight:800;" id="fullName">—</p>
      <p style="font-size:0.75rem;color:var(--foreground);opacity:0.6;" id="username">@—</p>
    </div>

    <div class="card glass-strong shadow-elegant" style="margin-top:1rem;padding:0;overflow:hidden;">
      <div class="profile-row" style="display:flex;align-items:center;gap:0.75rem;padding:1rem 1.25rem;">
        <div style="height:2.5rem;width:2.5rem;border-radius:1rem;background:color-mix(in oklab, var(--primary) 15%, transparent);display:grid;place-items:center;color:var(--primary);">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1rem;width:1rem;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--foreground);opacity:0.55;">Username</p>
          <p style="font-size:0.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="rowUsername">—</p>
        </div>
      </div>
      <div style="border-top:1px solid rgb(255 255 255 / 0.1);display:flex;align-items:center;gap:0.75rem;padding:1rem 1.25rem;">
        <div style="height:2.5rem;width:2.5rem;border-radius:1rem;background:color-mix(in oklab, var(--primary) 15%, transparent);display:grid;place-items:center;color:var(--primary);">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1rem;width:1rem;"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--foreground);opacity:0.55;">Email</p>
          <p style="font-size:0.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="rowEmail">—</p>
        </div>
      </div>
      <div style="border-top:1px solid rgb(255 255 255 / 0.1);display:flex;align-items:center;gap:0.75rem;padding:1rem 1.25rem;">
        <div style="height:2.5rem;width:2.5rem;border-radius:1rem;background:color-mix(in oklab, var(--primary) 15%, transparent);display:grid;place-items:center;color:var(--primary);">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1rem;width:1rem;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path></svg>
        </div>
        <div style="flex:1;min-width:0;">
          <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--foreground);opacity:0.55;">Referral code</p>
          <p style="font-size:0.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="rowReferral">—</p>
        </div>
        <button class="btn btn-sm" id="copyCodeBtn" style="background:none;border:1px solid color-mix(in oklab, var(--primary) 50%, transparent);color:var(--primary);font-size:0.75rem;font-weight:700;padding:0.375rem 0.75rem;border-radius:999px;">Copy</button>
      </div>
    </div>

    <!-- Account Details -->
    <div class="card glass-strong shadow-elegant" style="margin-top:1rem;padding:1.5rem;">
      <div class="sec-head">
        <h2>Account Details</h2>
      </div>
      <p style="font-size:0.75rem;color:var(--foreground);opacity:0.6;margin-bottom:1rem;">Add your bank details so withdrawals go straight to your account.</p>
      <div style="display:grid;gap:0.875rem;">
        <label class="block">
          <span class="field-label">Bank Name</span>
          <input type="text" class="field" id="bankName" placeholder="e.g. Opay / Access / GTB...">
        </label>
        <label class="block">
          <span class="field-label">Account Name</span>
          <input type="text" class="field" id="accountName" placeholder="Full name on the account">
        </label>
        <label class="block">
          <span class="field-label">Account Number</span>
          <input type="text" class="field" id="accountNumber" inputmode="numeric" pattern="\d{10,11}" placeholder="10-digit account number">
        </label>
        <button type="button" class="btn btn-aqua btn-block" id="saveAccountBtn" style="padding:0.9rem;">Save Account Details</button>
        <div class="link-status" id="accountStatus" style="font-size:0.8rem;margin-top:0.5rem;min-height:1.2em;color:oklch(85% 0.13 160);"></div>
      </div>
    </div>

    <button id="signoutBtn" class="btn btn-danger-ghost btn-block" style="margin-top:1.5rem;padding:0.875rem;">
      Sign out
    </button>

  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="toast" id="toastBar"></div>

<script type="module">
  import { getCurrentUser, getUsers, saveUsers, saveUser, clearUser, renderNav, toast } from "./assets/app.js";

  const user = getCurrentUser();
  if (!user) { window.location.href = "login.html"; throw new Error("redirect"); }

  function load() {
    document.getElementById("avatarLetter").textContent = (user.fullName || "?").charAt(0).toUpperCase();
    document.getElementById("fullName").textContent = user.fullName || "—";
    document.getElementById("username").textContent = "@" + (user.username || "");
    document.getElementById("rowUsername").textContent = user.username || "—";
    document.getElementById("rowEmail").textContent = user.email || "—";
    const code = user.referralCode || user.username || "";
    document.getElementById("rowReferral").textContent = code;
    document.getElementById("copyCodeBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(code).then(() => toast("Referral code copied!"));
    });

    // prefill account details
    document.getElementById("bankName").value = user.bankName || "";
    document.getElementById("accountName").value = user.accountName || "";
    document.getElementById("accountNumber").value = user.accountNumber || "";

    renderNav("profile");
  }

  const accNum = document.getElementById("accountNumber");
  accNum.addEventListener("input", () => { accNum.value = accNum.value.replace(/\D/g, ""); });

  document.getElementById("saveAccountBtn").addEventListener("click", () => {
    const status = document.getElementById("accountStatus");
    const bankName = document.getElementById("bankName").value.trim();
    const accountName = document.getElementById("accountName").value.trim();
    const accountNumber = accNum.value.trim();

    if (!bankName || !accountName || accountNumber.length < 10) {
      status.textContent = "Please fill in valid bank details.";
      status.style.color = "oklch(75% 0.15 25)";
      return;
    }

    user.bankName = bankName;
    user.accountName = accountName;
    user.accountNumber = accountNumber;
    saveUser(user);

    const users = getUsers();
    const idx = users.findIndex(u => u.email === user.email);
    if (idx >= 0) { users[idx] = user; saveUsers(users); }

    status.textContent = "✓ Account details saved!";
    status.style.color = "oklch(85% 0.13 160)";
    toast("Account details saved!");
  });

  document.getElementById("signoutBtn").addEventListener("click", () => { clearUser(); window.location.href = "login.html"; });

  load();
</script>
</body>
</html>
