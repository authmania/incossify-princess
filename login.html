<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Sign in — Incossify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="auth-shell">
  <div style="position:absolute;inset:0;background:var(--background);z-index:-1;"></div>
  <div style="position:absolute;inset:0;background:var(--gradient-hero);opacity:0.4;z-index:-1;"></div>
  <div class="rain" style="position:absolute;inset:0;opacity:0.2;z-index:-1;"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <header class="wrap auth-header">
    <a href="index.html" class="logo lg"><img src="assets/logo-CUooZ1Ch.png" alt="Incossify" draggable="false"><span class="name" style="font-size:1.5rem;">Incossify</span></a>
    <a href="index.html" class="back">← Back home</a>
  </header>

  <main class="wrap-md" style="max-width:28rem;padding:2.5rem 0 4rem;">
    <div style="position:relative;">
      <div style="position:absolute;inset:-1rem;background:var(--gradient-aqua);border-radius:2.5rem;filter:blur(3rem);opacity:0.15;"></div>
      <form class="card glass-strong shadow-elegant" id="loginForm" style="position:relative;padding:1.75rem 2.5rem;">
        <div style="display:flex;justify-content:center;margin-bottom:1.25rem;">
          <div style="height:3rem;width:3rem;border-radius:1rem;background:var(--gradient-aqua);display:grid;place-items:center;box-shadow:var(--shadow-aqua);">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1.25rem;width:1.25rem;color:var(--primary-foreground);"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </div>
        </div>
        <div style="margin-bottom:1.75rem;text-align:center;">
          <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.02em;">Welcome back</h1>
          <p style="margin-top:0.375rem;font-size:0.875rem;color:var(--foreground);opacity:0.65;">Sign in to continue earning on Incossify.</p>
        </div>

        <div class="field-error" id="loginError" style="display:none;margin-bottom:1rem;"></div>

        <div style="display:grid;gap:1rem;">
          <label class="block">
            <span class="field-label">Email or username</span>
            <input required type="text" class="field" id="identifier" placeholder="you@example.com">
          </label>
          <label class="block">
            <span class="field-label">Password</span>
            <div style="position:relative;">
              <input required type="password" class="field pr-11" id="password" placeholder="Your password">
              <button type="button" class="pass-toggle" id="passToggle" aria-label="Show password" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);color:var(--foreground);opacity:0.55;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1rem;width:1rem;"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </label>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.875rem;">
            <label style="display:flex;align-items:center;gap:0.5rem;color:var(--foreground);opacity:0.7;cursor:pointer;">
              <input type="checkbox" id="remember" checked style="width:1rem;height:1rem;accent-color:var(--primary);border-radius:0.25rem;"> Remember me
            </label>
            <a href="register.html" style="color:var(--primary);font-weight:600;">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-aqua btn-block" id="loginBtn" style="margin-top:1.75rem;padding:1rem;">
          Sign in
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1rem;width:1rem;"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
        <p style="margin-top:1.5rem;text-align:center;font-size:0.875rem;color:var(--foreground);opacity:0.65;">New to Incossify? <a href="register.html" style="color:var(--primary);font-weight:600;">Create an account</a></p>
      </form>
    </div>
  </main>
</div>

<script type="module">
  import { getUsers, saveUser } from "./assets/app.js";

  const pass = document.getElementById("password");
  document.getElementById("passToggle").addEventListener("click", () => {
    const show = pass.type === "password";
    pass.type = show ? "text" : "password";
  });

  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const errBox = document.getElementById("loginError");

  function showError(msg) { errBox.textContent = msg; errBox.style.display = "block"; }
  function resetBtn() {
    btn.disabled = false;
    btn.innerHTML = 'Sign in <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1rem;width:1rem;"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errBox.style.display = "none";
    const identifier = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value;

    const users = getUsers();
    const match = users.find(u =>
      u.email.toLowerCase() === identifier.toLowerCase() ||
      u.username.toLowerCase() === identifier.toLowerCase()
    );

    if (!match) { showError("No account found with those details."); return; }
    if (match.password !== password) { showError("Incorrect password. Try again."); return; }

    saveUser(match);
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
